[defaults]
inventory = ./etc/inventory.ini
roles_path = galaxy-roles
vault_password_file = ~/.vault_pass.txt
# Gather each host's facts once per run instead of at the start of every play.
# The cache stays in memory: a persistent one would serve stale facts (e.g.
# distribution_release) for a day after a release upgrade.
gathering = smart
fact_caching = memory
retry_files_enabled = True
retry_files_save_path = ~/.ansible-retry

interpreter_python=auto_silent

callbacks_enabled = timer, profile_tasks, profile_roles

[ssh_connection]
pipelining = True
