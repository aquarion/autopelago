---
# Vendored rather than apt_key, which needs apt-key (removed in APT 3,
# Ubuntu 25.04+). From https://repo.jellyfin.org/ubuntu/jellyfin_team.gpg.key,
# fingerprint 4918 AABC 486C A052 358D 778D 4902 3CD0 1DE2 1A7B.
- name: Upload Jellyfin GPG key
  ansible.builtin.copy:
    src: jellyfin.asc
    dest: /etc/apt/keyrings/jellyfin.asc
    owner: root
    group: root
    mode: "0644"
  tags:
    - jellyfin

- name: Get DEB architecture
  ansible.builtin.shell: dpkg --print-architecture
  register: jellyfin_deb_architecture
  tags:
    - jellyfin
  changed_when: false

- name: Jellyfin Repo
  ansible.builtin.deb822_repository:
    name: jellyfin
    uris: https://repo.jellyfin.org/{{ ansible_facts['distribution'] | lower }}
    suites: "{{ ansible_facts['distribution_release'] }}"
    state: present
    signed_by: /etc/apt/keyrings/jellyfin.asc
    components: main
    architectures: "{{ jellyfin_deb_architecture.stdout }}"

  tags:
    - jellyfin

- name: Remove old apt_key Jellyfin keyring
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/keyrings/jellyfin.gpg
    - /etc/apt/keyrings/jellyfin.gpg~
  tags:
    - jellyfin

- name: Install jellyfin
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
    update_cache: true
    cache_valid_time: 21600
  loop:
    - jellyfin
  tags:
    - jellyfin

- name: Send admin emails to admin
  ansible.builtin.copy:
    content: "{{ forward_emails_to }}"
    dest: ~{{ item }}/.forward
    mode: a=rw
  with_items:
    - jellyfin
  tags:
    - users
  when: forward_emails_to is defined
