---
# apt_key needs apt-key, which APT 3 (Ubuntu 26.04) no longer has; the key is ASCII-armored, so .asc
- name: Download Jellyfin GPG key
  ansible.builtin.get_url:
    url: https://repo.jellyfin.org/{{ ansible_distribution | lower }}/jellyfin_team.gpg.key
    dest: /etc/apt/keyrings/jellyfin.asc
    force: true
    owner: root
    group: root
    mode: "0644"
  tags:
    - jellyfin

- name: Get DEB architecture
  ansible.builtin.shell: dpkg --print-architecture
  register: jellyfin_deb_architecture
  tags:
    - jellyfin
  changed_when: false

- name: Jellyfin Repo
  ansible.builtin.deb822_repository:
    name: jellyfin
    uris: https://repo.jellyfin.org/{{ ansible_distribution | lower }}
    suites: "{{ ansible_distribution_release }}"
    state: present
    signed_by: /etc/apt/keyrings/jellyfin.asc
    components: main
    architectures: "{{ jellyfin_deb_architecture.stdout }}"

  tags:
    - jellyfin

- name: Remove old apt_key Jellyfin keyring
  ansible.builtin.file:
    path: /etc/apt/keyrings/jellyfin.gpg
    state: absent
  tags:
    - jellyfin

- name: Install jellyfin
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
    update_cache: true
    cache_valid_time: 21600
  loop:
    - jellyfin
  tags:
    - jellyfin

- name: Send admin emails to admin
  ansible.builtin.copy:
    content: "{{ forward_emails_to }}"
    dest: ~{{ item }}/.forward
    mode: a=rw
  with_items:
    - jellyfin
  tags:
    - users
  when: forward_emails_to is defined
