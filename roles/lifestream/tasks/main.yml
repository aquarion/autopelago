---
- name: Configure Redis lifestream user password
  # Own user (not sharing dockersites) so its permissions can be tuned
  # independently — needs &* (pub/sub channel access) for the OAuth
  # callback catcher's Redis pub/sub, which dockersites doesn't have.
  ansible.builtin.lineinfile:
    path: /etc/redis/users.acl
    # Store the password's SHA-256 (`#<hex>`), not the plaintext (`>pass`): Redis
    # hashes what clients send and compares. Quoted, because an unquoted ` #`
    # starts a YAML comment and would silently drop the password entirely.
    line: "user lifestream on +@all -DEBUG ~* &* #{{ lifestream_redis_password | hash('sha256') }}"
    regex: "^user lifestream "
  no_log: true
  notify:
    - Reload Redis ACL
  tags:
    - redis
    - lifestream
