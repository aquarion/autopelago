---
- name: Install required packages
  ansible.builtin.apt:
    package: "{{ item }}"
    state: present
  loop:
    - nginx
    - python3-passlib
    - libnginx-mod-http-fancyindex

# Only letsencrypt_ssl.conf is still static here; every other cert's snippet is generated by
# the certbot role from certbot_certs (see host_vars/firth.water.gkhs.net/certbot.yml).
- name: Delete old letsencrypt ssl snippet (pre-ssl/ subdirectory layout)
  ansible.builtin.file:
    path: /etc/nginx/snippets/letsencrypt_ssl.conf
    state: absent
  notify:
    - Validate nginx configuration
    - Reload nginx
  tags:
    - nginx
    - nginx_ssl

- name: Configure letsencrypt ssl snippet
  ansible.builtin.template:
    src: ssl/letsencrypt_ssl.conf
    dest: /etc/nginx/snippets/ssl/letsencrypt_ssl.conf
    mode: "0644"
  notify:
    - Validate nginx configuration
    - Restart nginx
  tags:
    - nginx
    - nginx_ssl

- name: Configure config overrides
  ansible.builtin.template:
    src: "{{ item }}"
    dest: /etc/nginx/snippets/{{ item | basename }}
    mode: "0644"
  with_fileglob:
    - templates/nginx_snippets/*
  notify:
    - Validate nginx configuration
    - Reload nginx
  tags:
    - nginx

- name: Configure conf.d items
  ansible.builtin.template:
    src: "{{ item }}"
    dest: /etc/nginx/conf.d/{{ item | basename }}
    mode: "0644"
  with_fileglob:
    - templates/nginx_confd/*
  notify:
    - Validate nginx configuration
    - Restart nginx
  tags:
    - nginx

- name: Configure nginx sites as available
  ansible.builtin.template:
    src: "{{ item }}"
    dest: /etc/nginx/sites-available/{{ item | basename }}
    mode: "0644"
  with_fileglob:
    - templates/vhosts/*
  notify:
    - Validate nginx configuration
    - Restart nginx
  tags:
    - streamsite
    - nginx
    - nginx_sites

- name: Configure nginx sites as enabled
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/{{ item | basename }}
    src: ../sites-available/{{ item | basename }}
    state: link
    mode: "0644"
  with_fileglob:
    - templates/vhosts/*
  notify:
    - Validate nginx configuration
    - Restart nginx
  tags:
    - streamsite
    - nginx
    - nginx_sites

- name: Configure dead nginx sites as disabled
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/{{ item | basename }}
    state: absent
  with_fileglob:
    - templates/deleted_vhosts/*
  notify:
    - Validate nginx configuration
    - Restart nginx
  tags:
    - streamsite
    - nginx
    - nginx_sites

- name: Configure dead nginx sites as unavailable
  ansible.builtin.file:
    path: /etc/nginx/sites-available/{{ item | basename }}
    state: absent
  with_fileglob:
    - templates/deleted_vhosts/*
  notify:
    - Validate nginx configuration
    - Restart nginx
  tags:
    - streamsite
    - nginx
    - nginx_sites

- name: Streamsite Basic Auth
  community.general.htpasswd:
    path: /etc/nginx/streamsite.htpass
    name: "{{ item.user }}"
    password: "{{ item.password }}"
    mode: "0644"
  loop: "{{ streamsite_users }}"
  no_log: true
  tags:
    - streamsite
    - nginx_sites
