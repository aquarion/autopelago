# {{ ansible_managed }}
# Access log format for otlp_ingest that records the request Origin, so a
# misconfigured/rejected CORS allow-list entry can be diagnosed from server
# logs alone instead of requiring a client-side repro.
log_format otlp_ingest '$remote_addr - [$time_local] "$request" $status '
                       'origin="$http_origin" rt=$request_time';
