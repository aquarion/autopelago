# {{ ansible_managed }}
# Allow-list of origins permitted to POST browser telemetry to the OTLP ingester.
# Extend with one line per origin as more apps adopt browser-side OTel.
map $http_origin $cors_origin_otlp_ingest {
    default "";
    "https://bloomfeed.app" $http_origin;
    "https://beta.bloomfeed.app" $http_origin;
}
