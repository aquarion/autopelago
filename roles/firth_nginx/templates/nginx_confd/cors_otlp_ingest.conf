# {{ ansible_managed }}
# Allow-list of origins permitted to POST browser telemetry to the OTLP ingester.
# Derived from firth_laravel_app_apps - set `browser_otel: true` on an app (and
# optionally override per staging) to add its origin here.
map $http_origin $cors_origin_otlp_ingest {
    default "";
{% for app in firth_laravel_app_apps | default([]) %}
{% if app.browser_otel | default(false) %}
    "{{ app.app_url }}" $http_origin;
{% endif %}
{% if app.staging is defined and (app.staging.browser_otel | default(app.browser_otel | default(false))) %}
    "{{ app.staging.app_url }}" $http_origin;
{% endif %}
{% endfor %}
}
