---
- name: Check for existing archive of {{ flr_ctx.name }}
  ansible.builtin.stat:
    path: "{{ docker_root }}/{{ flr_ctx.name }}-archive-{{ flr_ctx.archive_date }}.tar.bz2"
  register: firth_laravel_app_remove_archive_stat
  tags: [firth_laravel_app, firth_laravel_app_remove]

- name: Log archive already exists for {{ flr_ctx.name }}
  ansible.builtin.debug:
    msg: >
      Archive {{ docker_root }}/{{ flr_ctx.name }}-archive-{{ flr_ctx.archive_date }}.tar.bz2
      already exists — skipping archive step.
  when: firth_laravel_app_remove_archive_stat.stat.exists
  tags: [firth_laravel_app, firth_laravel_app_remove]

- name: Archive {{ flr_ctx.name }}
  tags: [firth_laravel_app, firth_laravel_app_remove]
  when: not firth_laravel_app_remove_archive_stat.stat.exists
  vars:
    # Staged on disk next to the final archive, not in /tmp: /tmp is a RAM-backed
    # tmpfs from Ubuntu 24.10, and the dump and storage tar are uncompressed.
    firth_laravel_app_remove_staging_dir: "{{ docker_root }}/.{{ flr_ctx.name }}-archive-{{ flr_ctx.archive_date }}"
  block:
    - name: Create archive staging directory for {{ flr_ctx.name }}
      ansible.builtin.file:
        path: "{{ firth_laravel_app_remove_staging_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Check if database exists for {{ flr_ctx.name }}
      ansible.mysql.mysql_info:
        login_host: "{{ firth_laravel_app_remove_mysql_login_host }}"
        login_user: "{{ firth_laravel_app_remove_mysql_login_user }}"
        login_password: "{{ mysql_root_password }}"
        filter:
          - databases
      register: firth_laravel_app_remove_mysql_info
      no_log: true
      changed_when: false
      when: flr_ctx.mysql | length > 0

    - name: Dump database for {{ flr_ctx.name }}
      ansible.builtin.shell:
        cmd: >
          mysqldump
          -h {{ firth_laravel_app_remove_mysql_login_host }}
          -u {{ firth_laravel_app_remove_mysql_login_user }}
          -p'{{ mysql_root_password }}'
          {{ flr_ctx.mysql.db_name }}
          > {{ firth_laravel_app_remove_staging_dir }}/{{ flr_ctx.name }}-{{ flr_ctx.archive_date }}.sql
      when:
        - flr_ctx.mysql | length > 0
        - flr_ctx.mysql.db_name in (firth_laravel_app_remove_mysql_info.databases | default({}))
      no_log: true
      changed_when: true

    - name: Copy docker-compose.yml for {{ flr_ctx.name }}
      ansible.builtin.copy:
        src: "{{ docker_root }}/{{ flr_ctx.name }}/docker-compose.yml"
        dest: "{{ firth_laravel_app_remove_staging_dir }}/{{ flr_ctx.name }}-docker-compose-{{ flr_ctx.archive_date }}.yml"
        remote_src: true
        owner: root
        group: root
        mode: "0640"

    - name: Archive storage volume for {{ flr_ctx.name }}
      ansible.builtin.shell:
        cmd: >
          docker run --rm
          -v {{ flr_ctx.name }}_storage:/storage
          alpine
          tar -C /storage -cf - .
          > {{ firth_laravel_app_remove_staging_dir }}/{{ flr_ctx.name }}-storage-{{ flr_ctx.archive_date }}.tar
      changed_when: true

    - name: Set archive file list for {{ flr_ctx.name }}
      ansible.builtin.set_fact:
        firth_laravel_app_remove_archive_files: >-
          {{ (
            [
              flr_ctx.name ~ '-docker-compose-' ~ flr_ctx.archive_date ~ '.yml',
              flr_ctx.name ~ '-storage-' ~ flr_ctx.archive_date ~ '.tar',
            ] + ([ flr_ctx.name ~ '-' ~ flr_ctx.archive_date ~ '.sql' ] if flr_ctx.mysql | length > 0 and flr_ctx.mysql.db_name in (firth_laravel_app_remove_mysql_info.databases
          | default({})) else [])
          ) | join(' ') }}

    - name: Create archive tarball for {{ flr_ctx.name }} # noqa: command-instead-of-module
      # ansible.builtin.archive does not support -C (change directory) or a
      # space-separated dynamic file list without a full path rewrite.
      ansible.builtin.shell:
        cmd: >
          tar -cjf
          {{ docker_root }}/{{ flr_ctx.name }}-archive-{{ flr_ctx.archive_date }}.tar.bz2
          -C {{ firth_laravel_app_remove_staging_dir }} {{ firth_laravel_app_remove_archive_files }}
      changed_when: true

    - name: Set ownership on archive for {{ flr_ctx.name }}
      ansible.builtin.file:
        path: "{{ docker_root }}/{{ flr_ctx.name }}-archive-{{ flr_ctx.archive_date }}.tar.bz2"
        owner: root
        group: root
        mode: "0640"

  rescue:
    - name: Debug archive failure for {{ flr_ctx.name }}
      ansible.builtin.debug:
        msg: >
          Failed task: {{ ansible_failed_task.name }}.
          Error: {{ ansible_failed_result.msg | default(ansible_failed_result.stderr) | default('unknown') }}.
          Common causes: invalid mysql_root_password, Docker unavailable,
          missing {{ docker_root }}/{{ flr_ctx.name }}/docker-compose.yml.

    - name: Abort after archive failure for {{ flr_ctx.name }}
      ansible.builtin.fail:
        msg: "Cannot continue: archive of {{ flr_ctx.name }} failed."

  always:
    - name: Remove archive staging directory for {{ flr_ctx.name }}
      ansible.builtin.file:
        path: "{{ firth_laravel_app_remove_staging_dir }}"
        state: absent
