---
# tasks file for firth-dovecot
- name: Install Dovecot
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  tags: dovecot
  with_items:
    - dovecot-imapd
    - dovecot-pop3d
  notify: Restart Dovecot

- name: Dovecot Auth
  ansible.builtin.template:
    src: passwd.j2
    dest: /etc/dovecot/passwd
    mode: "0644"
    owner: dovecot
    group: dovecot
  tags: dovecot

- name: Add Dovecot user to certbot_access group
  ansible.builtin.user:
    name: dovecot
    groups: certbot_access
    append: true
  tags: dovecot

- name: Gather installed package versions
  ansible.builtin.package_facts:
  tags: dovecot

- name: Configure Dovecot
  ansible.builtin.template:
    # Dovecot 2.4 uses an incompatible config format
    src: "{{ 'dovecot24.conf.j2' if dovecot_version is version('2.4', '>=') else 'dovecot.conf.j2' }}"
    dest: /etc/dovecot/local.conf
    mode: "0644"
  vars:
    # Strip the Debian epoch ("1:2.4.2+dfsg1-...") so the version test can compare it
    dovecot_version: "{{ ansible_facts.packages['dovecot-core'][0].version | regex_replace('^[0-9]+:', '') }}"
  # Only absent in --check on a host without Dovecot yet, where Install Dovecot
  # didn't really install it; a real run always has it by this point.
  when: "'dovecot-core' in ansible_facts.packages"
  notify: Restart Dovecot
  tags: dovecot
