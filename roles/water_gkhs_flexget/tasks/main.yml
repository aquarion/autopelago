---
- name: Install Flexget Apt Packages
  ansible.builtin.apt:
    state: present
    pkg:
      - python3
      - virtualenv
      - acl
  tags:
    - flexget
    - media

- name: Do things as the media centre user
  ansible.builtin.import_tasks: media-user-tasks.yml
  become: true
  become_user: "{{ media_user }}"
  tags:
    - flexget
    - media

# FlexGet is retired in favour of Sonarr (both grabbing the same shows would double-download).
# Only the cron is removed for now: the virtualenv and config stay for rollback until a Sonarr
# grab has been seen end to end (then remove them with state: absent).
- name: Remove flexget cron
  ansible.builtin.cron:
    name: flexget
    user: "{{ media_user }}"
    cron_file: flexget
    state: absent
  tags:
    - flexget
    - media
