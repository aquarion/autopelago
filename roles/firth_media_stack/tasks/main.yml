---
- name: Configure media stack
  tags:
    - media_stack
  block:
    - name: Create media stack directory
      ansible.builtin.file:
        path: "{{ firth_media_stack_dir }}"
        state: directory
        owner: "{{ firth_media_stack_user }}"
        group: docker
        mode: "0755"

    - name: Create media stack config directories
      ansible.builtin.file:
        path: "{{ firth_media_stack_dir }}/config{{ item }}"
        state: directory
        owner: "{{ firth_media_stack_user }}"
        group: "{{ firth_media_stack_group }}"
        # The containers reset their /config to 0755 on start; match it.
        mode: "0755"
      loop: "{{ [''] + (['/sonarr', '/radarr', '/prowlarr', '/bazarr', '/jellyseerr'] if firth_media_stack_arr_enabled else []) }}"

    # Where the *arrs' Transmission clients download to. Outside completed/, so
    # Filebot's watcher and cron never see them.
    - name: Create the *arr download directories
      ansible.builtin.file:
        path: "{{ firth_media_stack_torrents_dir }}/arr{{ item }}"
        state: directory
        owner: "{{ firth_media_stack_user }}"
        group: "{{ firth_media_stack_group }}"
        mode: "2775"
      loop:
        - ""
        - /tv
        - /movies
      when: firth_media_stack_arr_enabled

    # The compose file holds the OpenVPN credentials: 0640, and no --diff output.
    - name: Template docker-compose.yml for the media stack
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ firth_media_stack_dir }}/docker-compose.yml"
        owner: "{{ firth_media_stack_user }}"
        group: docker
        mode: "0640"
      diff: false
      notify: Restart media stack

    - name: Start media stack
      community.docker.docker_compose_v2:
        project_src: "{{ firth_media_stack_dir }}"
        pull: always
        state: present
        recreate: auto

    - name: Read tailscale serve status
      ansible.builtin.command: tailscale serve status --json
      register: firth_media_stack_serve_status
      changed_when: false
      check_mode: false
      when: firth_media_stack_arr_enabled

    # ponytail: only checks that the service exists, not that its port still
    # matches; if a port changes, `tailscale serve clear svc:<name>` and re-run.
    - name: Serve the *arr UIs as Tailscale Services
      ansible.builtin.command: >-
        tailscale serve --service=svc:{{ item.key }} --https=443 --bg
        http://127.0.0.1:{{ item.value }}
      loop: "{{ firth_media_stack_tailscale_services | dict2items }}"
      when:
        - firth_media_stack_arr_enabled
        - "'svc:' ~ item.key not in (firth_media_stack_serve_status.stdout | from_json).get('Services', {})"
      changed_when: true

  rescue:
    - name: Debug media stack failure
      ansible.builtin.debug:
        var: ansible_failed_result

    - name: Abort media stack failure
      ansible.builtin.fail:
        msg: "Cannot continue: media stack setup failed."
