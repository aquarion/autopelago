# Istic.Networks DNS
- name: Istic.Networks DNS
  tags:
    - aws
    - istic_sys
  block:
    - name: "Istic.network Route53 records"
      ansible.builtin.include_tasks:
        file: ../../included_tasks/route53_records.yml
        apply:
          tags:
            - aws
            - istic_sys
            - istic_net
      vars:
        _r53_zone: istic.network
        _r53_aws_profile: istic
        _r53_records:
          - { name: "@", type: A, value: "{{ loadbalancer_ip }}" }
          - { name: www, type: A, value: "{{ loadbalancer_ip }}" }
          - { name: blogs, type: A, value: "{{ loadbalancer_ip }}" }
          - { name: "*.blogs", type: A, value: "{{ loadbalancer_ip }}" }
          - { name: _c1183ee4420cdfb985ea6b5cf8dbcd17, type: CNAME, value: _09ed8ecd27379ac538a345e2e732fd30.zrvsvrxrgs.acm-validations.aws. }
      tags:
        - istic_net

    # Istic.systems

    - name: "Istic.systems Route53 records"
      ansible.builtin.include_tasks:
        file: ../../included_tasks/route53_records.yml
        apply:
          tags:
            - aws
            - istic_sys
            - istic_net
      vars:
        _r53_zone: istic.systems
        _r53_aws_profile: istic
        _r53_records:
          - { name: "@", type: A, value: "{{ loadbalancer_ip }}" }
          - { name: www, type: A, value: "{{ loadbalancer_ip }}" }
          - { name: cenote, type: A, state: absent, value: 109.74.192.161 }
          - { name: atoll, type: A, value: "{{ atoll_ip }}" }
          - { name: firth, type: A, value: "{{ firth_ip }}" }
          - { name: tributary, type: A, value: "{{ firth_ip }}" }
          - { name: manage, type: A, value: "{{ loadbalancer_ip }}" }
          - { name: files-voyeur, type: A, value: d14zhwhwrp2p47.cloudfront.net., alias: true, alias_hosted_zone_id: Z2FDTNDATAQYW2 }
          - { name: _f210fac1759ae4a6cd375df08ab6de4c, type: CNAME, value: _eae841e7d9904b7f2792cec3dbd82da6.zrvsvrxrgs.acm-validations.aws. }
          - { name: elasticsearch.svc, type: CNAME, state: absent, value: "{{ firth_ip }}" }
          - { name: elasticsearch.svc, type: A, value: "{{ firth_ip }}" }
      tags:
        - istic_net
        - istic_sys

    # New istic.systems records

    - name: "Istic.systems Route53 records"
      ansible.builtin.include_tasks:
        file: ../../included_tasks/route53_records.yml
        apply:
          tags:
            - aws
            - istic_sys
      vars:
        _r53_zone: istic.systems
        _r53_aws_profile: istic
        _r53_records:
          - { name: signoz.svc, type: A, value: "{{ loadbalancer_ip }}" }
          - { name: otlp.svc, type: A, value: "{{ loadbalancer_ip }}" }
          - { name: otel-agents.svc, type: A, value: "{{ loadbalancer_ip }}" }
      tags:
        - istic_sys

  rescue:
    - name: "Failure warning"
      ansible.builtin.debug:
        msg: "AWS tasks failed"
    - name: "Failure execution"
      ansible.builtin.command:
        cmd: "false"

- name: Add Route53 item for SFTP server
  tags:
    - sftp
    - docker
    - istic_net
    - istic_sys
  block:
    - name: "Istic.systems Route53 records"
      ansible.builtin.include_tasks:
        file: ../../included_tasks/route53_records.yml
        apply:
          tags:
            - sftp
            - docker
            - istic_net
            - istic_sys
      vars:
        _r53_zone: istic.systems
        _r53_aws_profile: istic
        _r53_records:
          - { name: sftp.svc, type: A, value: "{{ firth_ip }}" }
          - { name: sftp, type: CNAME, value: sftp.svc.istic.systems }

  rescue:
    - name: Debug failure to create Route53 record for SFTP server
      ansible.builtin.debug:
        msg: "Failed to create Route53 record for SFTP server."
