---
# cernunnosdionysus.uk is registered in the istic AWS account.
- name: "Cernunnosdionysus.uk Route53 records"
  ansible.builtin.include_tasks:
    file: ../../included_tasks/route53_records.yml
    apply:
      tags:
        - cernunnosdionysus
  vars:
    _r53_zone: cernunnosdionysus.uk
    _r53_aws_profile: istic
    _r53_records:
      - { name: "@", type: A, value: "{{ loadbalancer_ip }}" }
      - { name: www, type: A, value: "{{ loadbalancer_ip }}" }
  tags:
    - cernunnosdionysus
