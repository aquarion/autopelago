---
- name: "Nanocountdown.com Route53 records"
  ansible.builtin.include_tasks:
    file: ../../included_tasks/route53_records.yml
    apply:
      tags:
        - nanocountdown
  vars:
    _r53_zone: nanocountdown.com
    _r53_aws_profile: istic
    _r53_records:
      - { name: "@", type: A, value: "{{ loadbalancer_ip }}" }
      - { name: dev, type: CNAME, state: absent, value: tributary.water.gkhs.net }
      - { name: dev, type: A, value: "{{ loadbalancer_ip }}" }
      - { name: www, type: CNAME, state: absent, value: tributary.water.gkhs.net }
      - { name: www, type: A, value: "{{ loadbalancer_ip }}" }
  tags:
    - nanocountdown
