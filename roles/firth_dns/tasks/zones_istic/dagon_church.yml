---
- name: "Dagon.church Route53 records"
  ansible.builtin.include_tasks:
    file: ../../included_tasks/route53_records.yml
    apply:
      tags:
        - dagon_church
  vars:
    _r53_zone: dagon.church
    _r53_aws_profile: istic
    _r53_records:
      - { name: "@", type: A, value: "{{ loadbalancer_ip }}" }
      - { name: live, type: CNAME, value: dagon.church }
      - { name: wiki, type: CNAME, value: dagon.church }
  tags:
    - dagon_church
