---
- name: "Nicholasavenell.com Route53 records"
  ansible.builtin.include_tasks:
    file: ../../included_tasks/route53_records.yml
  vars:
    _r53_zone: nicholasavenell.com
    _r53_aws_profile: aqcom
    _r53_records:
      - { name: "@", type: A, ttl: 86400, value: "{{ loadbalancer_ip }}" }
      - { name: "@", type: AAAA, value: "{{ loadbalancer_ipv6 }}" }
      - { name: www, type: A, value: "{{ loadbalancer_ip }}" }

