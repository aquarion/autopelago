---
- name: "Nicholasavenell.com Route53 records"
  ansible.builtin.include_tasks:
    file: ../../included_tasks/route53_records.yml
  vars:
    _r53_zone: nicholasavenell.com
    _r53_aws_profile: aqcom
    _r53_records:
      - { name: "@", type: A, ttl: 86400, value: "{{ loadbalancer_ip }}" }
      - { name: "@", type: AAAA, value: "{{ loadbalancer_ipv6 }}" }
      - { name: www, type: A, value: "{{ loadbalancer_ip }}" }

# Retired temporary hostname for lifestream-web, which now serves nicholasavenell.com directly.
- name: New.nicholasavenell.com. - A
  amazon.aws.route53:
    overwrite: true
    state: absent
    zone: nicholasavenell.com
    record: new.nicholasavenell.com.
    aws_profile: aqcom
    type: A
    ttl: "300"
    value: "{{ loadbalancer_ip }}"

- name: New.nicholasavenell.com. - AAAA
  amazon.aws.route53:
    overwrite: true
    state: absent
    zone: nicholasavenell.com
    record: new.nicholasavenell.com.
    aws_profile: aqcom
    type: AAAA
    ttl: "300"
    value: "{{ loadbalancer_ipv6 }}"

