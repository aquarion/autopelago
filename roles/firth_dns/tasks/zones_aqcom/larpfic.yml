---
- name: Larpfic.com
  amazon.aws.route53_zone:
    state: present
    zone: larpfic.com
    comment: larpfic
    aws_profile: aqcom
  tags:
    - larpfic

- name: Lrpfic.com
  amazon.aws.route53_zone:
    state: present
    zone: lrpfic.com
    comment: lrpfic
    aws_profile: aqcom
  tags:
    - larpfic

- name: "Larpfic.com Route53 records"
  ansible.builtin.include_tasks:
    file: ../../included_tasks/route53_records.yml
    apply:
      tags:
        - larpfic
  vars:
    _r53_zone: larpfic.com
    _r53_aws_profile: aqcom
    _r53_records:
      - { name: "@", type: A, value: "{{ loadbalancer_ip }}" }
      - { name: www, type: A, value: "{{ loadbalancer_ip }}" }
  tags:
    - larpfic

- name: "Lrpfic.com Route53 records"
  ansible.builtin.include_tasks:
    file: ../../included_tasks/route53_records.yml
    apply:
      tags:
        - larpfic
  vars:
    _r53_zone: lrpfic.com
    _r53_aws_profile: aqcom
    _r53_records:
      - { name: "@", type: A, value: "{{ loadbalancer_ip }}" }
      - { name: www, type: A, value: "{{ loadbalancer_ip }}" }
  tags:
    - larpfic
