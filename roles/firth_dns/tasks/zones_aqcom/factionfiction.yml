---
- name: "Factionfiction.net Route53 records"
  ansible.builtin.include_tasks:
    file: ../../included_tasks/route53_records.yml
  vars:
    _r53_zone: factionfiction.net
    _r53_aws_profile: aqcom
    _r53_records:
      - { name: "@", type: A, value: "{{ loadbalancer_ip }}" }
      - { name: "@", type: NS, ttl: 172800, value: "ns-1302.awsdns-34.org.,ns-1969.awsdns-54.co.uk.,ns-147.awsdns-18.com.,ns-614.awsdns-12.net." }
      - { name: www, type: CNAME, value: factionfiction.net }

