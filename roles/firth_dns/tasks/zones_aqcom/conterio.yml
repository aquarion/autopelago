---
- name: Conterio.co.uk.
  amazon.aws.route53_zone:
    state: present
    zone: conterio.co.uk.
    comment: Michael Conterio
    aws_profile: aqcom
  tags:
    - conterio

- name: "Conterio.co.uk Route53 records"
  ansible.builtin.include_tasks:
    file: ../../included_tasks/route53_records.yml
    apply:
      tags:
        - conterio
  vars:
    _r53_zone: conterio.co.uk
    _r53_aws_profile: aqcom
    _r53_records:
      - { name: "@", type: A, value: "{{ loadbalancer_ip }}" }
      - { name: michael, type: A, value: "{{ loadbalancer_ip }}" }
      - { name: www.michael, type: A, value: "{{ loadbalancer_ip }}" }
      - { name: www, type: A, value: "{{ loadbalancer_ip }}" }
  tags:
    - conterio

