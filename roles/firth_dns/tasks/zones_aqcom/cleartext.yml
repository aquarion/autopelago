---
- name: "Cleartextcontent.co.uk Route53 records"
  ansible.builtin.include_tasks:
    file: ../../included_tasks/route53_records.yml
  vars:
    _r53_zone: cleartextcontent.co.uk
    _r53_aws_profile: aqcom
    _r53_records:
      - { name: "@", type: A, value: "{{ loadbalancer_ip }}" }
      - { name: "@", type: MX, value: "10 cenote.gkhs.net" }
      - { name: "@", type: NS, ttl: 172800, value: "ns-797.awsdns-35.net.,ns-39.awsdns-04.com.,ns-2024.awsdns-61.co.uk.,ns-1219.awsdns-24.org." }
      - { name: www, type: A, value: "{{ loadbalancer_ip }}" }

