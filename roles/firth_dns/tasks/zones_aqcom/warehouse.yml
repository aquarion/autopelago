---
- name: "Warehousebasement.com Route53 records"
  ansible.builtin.include_tasks:
    file: ../../included_tasks/route53_records.yml
    apply:
      tags:
        - warehouse_basement
  vars:
    _r53_zone: warehousebasement.com
    _r53_aws_profile: aqcom
    _r53_records:
      - { name: "@", type: A, value: "{{ loadbalancer_ip }}" }
      - { name: "@", type: NS, ttl: 172800, value: "ns-983.awsdns-58.net.,ns-1661.awsdns-15.co.uk.,ns-1161.awsdns-17.org.,ns-271.awsdns-33.com." }
      - { name: www, type: CNAME, value: warehousebasement.com }
  tags:
    - warehouse_basement

