---
- name: Hubris.house
  amazon.aws.route53_zone:
    state: present
    zone: hubris.house
    comment: hubris.house
    aws_profile: aqcom
  tags:
    - hubris.house

- name: "Hubris.house Route53 records"
  ansible.builtin.include_tasks:
    file: ../../included_tasks/route53_records.yml
    apply:
      tags:
        - hubris.house
  vars:
    _r53_zone: hubris.house
    _r53_aws_profile: aqcom
    _r53_records:
      - { name: "@", type: A, value: "{{ loadbalancer_ip }}" }
      - { name: www, type: A, state: absent, value: "{{ loadbalancer_ip }}" }
      - { name: "35938230", type: CNAME, value: google.com }
      - { name: "*", type: A, value: "{{ loadbalancer_ip }}" }
      - { name: "*.local", type: A, value: 10.42.0.42 }
  tags:
    - hubris.house

- name: "Hubris.house Route53 records"
  ansible.builtin.include_tasks:
    file: ../../included_tasks/route53_records.yml
    apply:
      tags:
        - hubris.house
        - hubris.house.google
  vars:
    _r53_zone: hubris.house
    _r53_aws_profile: aqcom
    _r53_records:
      - { name: "@", type: TXT, value: '"google-site-verification=y3Y66Y4hWEyWQ3cm4WwsyH3Er9vEjzZxrKZAsNTXIE4"' }
      - { name: "@", type: MX, value: "1 ASPMX.L.GOOGLE.COM.,5 ALT1.ASPMX.L.GOOGLE.COM.,5 ALT2.ASPMX.L.GOOGLE.COM.,10 ALT3.ASPMX.L.GOOGLE.COM.,10 ALT4.ASPMX.L.GOOGLE.COM." }
  tags:
    - hubris.house
    - hubris.house.google
