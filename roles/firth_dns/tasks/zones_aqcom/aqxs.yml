---
- name: "Aqxs.net Route53 records"
  ansible.builtin.include_tasks:
    file: ../../included_tasks/route53_records.yml
  vars:
    _r53_zone: aqxs.net
    _r53_aws_profile: aqcom
    _r53_records:
      - { name: "@", type: A, ttl: 3600, value: "{{ loadbalancer_ip }}" }
      - { name: "@", type: NS, ttl: 172800, value: "ns-1408.awsdns-48.org.,ns-685.awsdns-21.net.,ns-40.awsdns-05.com.,ns-1866.awsdns-41.co.uk." }
      - { name: "@", type: TXT, value: ['"google-site-verification=SvTocYjKGCKTzN9BlJSdq0MVkEaFvEAum18VoLaKB5s"', '"v=spf1 a mx include:spf.mtasv.net ~all"'] }
      - { name: "*", type: A, ttl: 3600, value: "{{ loadbalancer_ip }}" }
      - { name: 20151026232244.pm._domainkey, type: TXT, value: '"k=rsa; p=MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQCGF2/JFx7pvFw7RU1wXzqtMohMaSZTEbeLscHSrvzrKKtH2M1zTY8YwIZpjFCjbCbQ2aW28bLzzhd2e1klZorwWV++CYoXnnGgVtz1241ToVPgKyKepmBn6E+3DaJZWsj17jINgEkxYoZ3hvp34y+NSFxlMR4bD9V3EetoxUAYgQIDAQAB"' }
      - { name: "@", type: MX, value: "1 ASPMX.L.GOOGLE.COM.,5 ALT1.ASPMX.L.GOOGLE.COM.,5 ALT2.ASPMX.L.GOOGLE.COM.,10 ASPMX2.GOOGLEMAIL.COM.,10 ASPMX3.GOOGLEMAIL.COM." }
      - { name: lists, type: MX, state: absent, ttl: 3600, value: "10 aspmx2.googlemail.com.,10 aspmx3.googlemail.com.,5 alt1.aspmx.l.google.com.,5 alt2.aspmx.l.google.com.,1 aspmx.l.google.com." }
      - { name: radiator.localdev, type: A, state: absent, value: 192.168.10.10 }
      - { name: pmbounce, type: CNAME, value: pm.mtasv.net }

