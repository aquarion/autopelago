- name: Larp.me.uk Zone
  amazon.aws.route53_zone:
    state: present
    zone: larp.me.uk
    aws_profile: aqcom
  tags:
    - larpmeuk

- name: "Larp.me.uk Route53 records"
  ansible.builtin.include_tasks:
    file: ../../included_tasks/route53_records.yml
    apply:
      tags:
        - larpmeuk
  vars:
    _r53_zone: larp.me.uk
    _r53_aws_profile: aqcom
    _r53_records:
      - { name: "@", type: A, value: "{{ loadbalancer_ip }}" }
      - { name: www, type: A, value: "{{ loadbalancer_ip }}" }
      - { name: pdforums, type: A, value: "{{ loadbalancer_ip }}" }
  tags:
    - larpmeuk
