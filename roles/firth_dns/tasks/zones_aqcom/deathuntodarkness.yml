---
- name: Deathuntodarkness DNS
  tags:
    - aws
    - deathuntodarkness
  block:
    - name: "Deathuntodarkness.org Route53 records"
      ansible.builtin.include_tasks:
        file: ../../included_tasks/route53_records.yml
        apply:
          tags:
            - aws
            - deathuntodarkness
      vars:
        _r53_zone: deathuntodarkness.org
        _r53_aws_profile: aqcom
        _r53_records:
          - { name: "@", type: PTR, state: absent, value: www.deathuntodarkness.org }
          - { name: www, type: CNAME, value: tributary.water.gkhs.net }
          - { name: _atproto, type: TXT, value: '"did=did:plc:wyhg6qkalevdg4ziff3m467i"' }
          - { name: _338fee8103d4fcbd7a999eba43c2bffd, type: CNAME, value: _02dcfe4b2c02abf0fc60b8a3e7be66aa.nhqijqilxf.acm-validations.aws. }
