---
- name: Kastark.co.uk.
  amazon.aws.route53_zone:
    state: present
    zone: kastark.co.uk.
    comment: K A Stark
    aws_profile: aqcom
  tags:
    - kastark

- name: "Kastark.co.uk Route53 records"
  ansible.builtin.include_tasks:
    file: ../../included_tasks/route53_records.yml
    apply:
      tags:
        - kastark
  vars:
    _r53_zone: kastark.co.uk
    _r53_aws_profile: aqcom
    _r53_records:
      - { name: "@", type: A, value: "{{ loadbalancer_ip }}" }
      - { name: www, type: CNAME, state: absent, value: kastark.co.uk. }
      - { name: www, type: A, value: "{{ loadbalancer_ip }}" }
  tags:
    - kastark

- name: Dhmstark.co.uk.
  amazon.aws.route53_zone:
    state: present
    zone: dhmstark.co.uk.
    comment: D H M Stark (redirects to kastark.co.uk)
    aws_profile: aqcom
  tags:
    - kastark

- name: "Dhmstark.co.uk Route53 records"
  ansible.builtin.include_tasks:
    file: ../../included_tasks/route53_records.yml
    apply:
      tags:
        - kastark
  vars:
    _r53_zone: dhmstark.co.uk
    _r53_aws_profile: aqcom
    _r53_records:
      - { name: "@", type: A, value: "{{ loadbalancer_ip }}" }
      - { name: www, type: A, value: "{{ loadbalancer_ip }}" }
  tags:
    - kastark
