---
water_gkhs_tailscale_hostname: "{{ inventory_hostname_short }}"
water_gkhs_tailscale_extra_args: ""

# Set in vault (e.g. group_vars/all/50-integrations.vault.yml) - a reusable or
# pre-authorized Tailscale auth key from https://login.tailscale.com/admin/settings/keys.
# Left blank until that vault variable exists, so the role installs and starts
# tailscaled but skips `tailscale up` rather than failing on an undefined var.
water_gkhs_tailscale_authkey: "{{ vault_tailscale_authkey | default('') }}"
