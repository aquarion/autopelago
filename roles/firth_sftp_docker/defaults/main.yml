---
# defaults file for roles/firth_sftp_docker

firth_sftp_docker_user: sftp_docker
firth_sftp_docker_group: sftp_docker

firth_sftp_docker_db_host: localhost
firth_sftp_docker_db_port: 3306
firth_sftp_docker_db_user:
firth_sftp_docker_db_password:
firth_sftp_docker_db_name:
firth_sftp_docker_www_data_uid:
firth_sftp_docker_www_data_gid:
# SFTP user accounts (username, password, uid/gid, public key) are managed
# entirely by Alchemistic's sftp_users table and reconciled at runtime by
# sftp-sync.sh - this role no longer owns any user identity data.
#
# These two variables cover non-identity infra wiring that individual users
# still need, keyed by plain username (must match an sftp_users.username
# row for the mount/sidecar to actually be usable):
#
# firth_sftp_docker_bind_mounts:
#   user1:
#     - source: /data/user1/files
#       target: files
#       read_only: false
#     - source: /data/user1/docs
#       target: docs
#       read_only: true
#
# firth_sftp_docker_web_sites:
#   user1:
#     web_domain: user1.example.com   # subdirectory under sftp/home/<user>/ to serve as webroot
#     backend: fpm                    # "fpm" (default) or "apache"
#     # backend: fpm - creates a phpfpm_<user> container with a Unix socket at
#     #   docker_root/sftp/run/<user>.sock
#     php_image: php:8.3-fpm-alpine   # fpm only, optional override, defaults to php:8.3-fpm-alpine
#     # backend: apache - creates a web_<user> container (plain static + mod_autoindex,
#     #   AllowOverride Indexes so the site's own .htaccess IndexOptions/HeaderName/ReadmeName
#     #   work) published on 127.0.0.1:<port> for nginx to proxy_pass to; no PHP involved
#     apache_image: httpd:2.4-alpine  # apache only, optional override
#     port: 4081                      # apache only, required, must be unique across sites
firth_sftp_docker_bind_mounts: {}
firth_sftp_docker_web_sites: {}
