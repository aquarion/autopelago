---
- name: AWS Config - Region
  community.general.ini_file:
    path: ~/.aws/config
    section: "profile {{ item }}"
    option: region
    value: "{{ aqcom_aws_default_region }}"
    mode: "0600"
    backup: true
  loop: "{{ aws_profiles_managed }}"
  tags:
    - aws
    - aws_profiles

- name: AWS Creds - Key
  community.general.ini_file:
    path: ~/.aws/credentials
    section: "{{ item }}"
    option: aws_access_key_id
    value: "{{ lookup('vars', item + '_aws_key') }}"
    mode: "0600"
    backup: true
  loop: "{{ aws_profiles_managed }}"
  no_log: true
  tags:
    - aws
    - aws_profiles

- name: AWS Creds - Secret
  community.general.ini_file:
    path: ~/.aws/credentials
    section: "{{ item }}"
    option: aws_secret_access_key
    value: "{{ lookup('vars', item + '_aws_secret') }}"
    mode: "0600"
    backup: true
  loop: "{{ aws_profiles_managed }}"
  no_log: true
  tags:
    - aws
    - aws_profiles

# Legacy section created by hand on firth before this role managed istic/aqcom; holds the same
# AWS access key as the istic profile. Delete, not just omit, so the leftover section doesn't
# linger on the host.
- name: AWS Creds - remove legacy istic-r53 profile
  community.general.ini_file:
    path: ~/.aws/credentials
    section: istic-r53
    state: absent
    mode: "0600"
    backup: true
  tags:
    - aws
    - aws_profiles

- name: AWS Config - remove legacy istic-r53 profile
  community.general.ini_file:
    path: ~/.aws/config
    section: profile istic-r53
    state: absent
    mode: "0600"
    backup: true
  tags:
    - aws
    - aws_profiles
