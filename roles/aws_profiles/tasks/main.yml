---
- name: AWS Config - Aqcom - Region
  community.general.ini_file:
    path: ~/.aws/config
    section: profile aqcom
    option: region
    value: "{{ aqcom_aws_default_region }}"
    mode: "0600"
    backup: true
  when: aws_profiles_manage_aqcom
  tags:
    - aws
    - aws_profiles

- name: AWS Creds - Aqcom - Key
  community.general.ini_file:
    path: ~/.aws/credentials
    section: aqcom
    option: aws_access_key_id
    value: "{{ aqcom_aws_key }}"
    mode: "0600"
    backup: true
  when: aws_profiles_manage_aqcom
  tags:
    - aws
    - aws_profiles

- name: AWS Creds - Aqcom - Secret
  community.general.ini_file:
    path: ~/.aws/credentials
    section: aqcom
    option: aws_secret_access_key
    value: "{{ aqcom_aws_secret }}"
    mode: "0600"
    backup: true
  when: aws_profiles_manage_aqcom
  tags:
    - aws
    - aws_profiles

- name: AWS Config - Istic - Region
  community.general.ini_file:
    path: ~/.aws/config
    section: profile istic
    option: region
    value: "{{ aqcom_aws_default_region }}"
    mode: "0600"
    backup: true
  tags:
    - aws
    - aws_profiles

- name: AWS Creds - istic - Key
  community.general.ini_file:
    path: ~/.aws/credentials
    section: istic
    option: aws_access_key_id
    value: "{{ istic_aws_key }}"
    mode: "0600"
    backup: true
  tags:
    - aws
    - aws_profiles

- name: AWS Creds - istic - Secret
  community.general.ini_file:
    path: ~/.aws/credentials
    section: istic
    option: aws_secret_access_key
    value: "{{ istic_aws_secret }}"
    mode: "0600"
    backup: true
  tags:
    - aws
    - aws_profiles

# Legacy section created by hand on firth before this role managed istic/aqcom; same key as
# istic. Delete, not just omit, so the leftover section doesn't linger on the host.
- name: AWS Creds - remove legacy istic-r53 profile
  community.general.ini_file:
    path: ~/.aws/credentials
    section: istic-r53
    state: absent
    mode: "0600"
    backup: true
  tags:
    - aws
    - aws_profiles

- name: AWS Config - remove legacy istic-r53 profile
  community.general.ini_file:
    path: ~/.aws/config
    section: profile istic-r53
    state: absent
    mode: "0600"
    backup: true
  tags:
    - aws
    - aws_profiles
